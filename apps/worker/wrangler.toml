# Ajino v5 — Cloudflare Worker Config
# Worker: agent-gateway (auth + rate limit + thin API proxy)
# Updated: 2026-06-08

name = "agent-gateway"
main = "src/index.ts"
compatibility_date = "2026-06-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ─── KV Namespaces ──────────────────────────────────
[[kv_namespaces]]
binding = "OTP_KV"
id = "ffa7e82c943b4cbdb427d184a40e3989"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "1ad9127dbf174f978c376b0ae91ba424"

# ─── Vectorize (PRIMARY vector search) ──────────────
[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "agent-kb"

# ─── R2 Buckets ─────────────────────────────────────
[[r2_buckets]]
binding = "R2_STORAGE"
bucket_name = "agent-storage"

[[r2_buckets]]
binding = "R2_BACKUPS"
bucket_name = "agent-backups"

# ─── Workers AI ─────────────────────────────────────
[ai]
binding = "AI"

# ─── Environment ────────────────────────────────────
[vars]
ENVIRONMENT = "production"

# Secrets (set via: wrangler secret put KEY)
# JWT_SECRET       — 64-char random string
# TELEGRAM_BOT_TOKEN — from @BotFather

# ─── Static Assets (React build) ─────────────────────
[assets]
directory = "./static"

# ─── Routes ─────────────────────────────────────────
[[routes]]
pattern = "ajinov5.cuong.ngo/*"
zone_name = "cuong.ngo"
